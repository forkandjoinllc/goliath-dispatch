name: CI

on:
  push:
    branches: [main]
  pull_request:

# Dummy values for the four secrets serverEnv() requires at import time
# (src/lib/env.ts) plus DATABASE_URL, so `next build` and every test layer
# can boot without any real credential. Every other provider-specific
# variable already has a working default (mock driver) in the schema, so
# nothing else needs to be set here for CI to run the full suite.
env:
  NODE_ENV: test
  APP_ENV: test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/goliath_test
  DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/goliath_test
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/goliath_test
  AUTH_SECRET: ci-dummy-auth-secret-not-for-production-use-000
  ENCRYPTION_KEY: ci-dummy-encryption-key-not-for-production-000
  SIGNATURE_HASH_PEPPER: ci-dummy-signature-pepper-not-for-prod-000
  PUBLIC_TRACKING_TOKEN_SECRET: ci-dummy-tracking-token-secret-not-prod-0
  CRON_SECRET: ci-dummy-cron-secret-not-for-production-use-000
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goliath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Unit + integration + component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve installed Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -pe "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # tests/e2e has no spec files in this checkout yet (docs/testing.md
      # §1 tracks this as a known gap) — Playwright errors out on an empty
      # test directory rather than passing trivially, so this step checks
      # for at least one spec before invoking it, and skips with a clear
      # message otherwise. Once real specs land under tests/e2e, this step
      # starts running them automatically with no workflow change needed.
      - name: E2E tests
        run: |
          if find tests/e2e -type f \( -name "*.spec.ts" -o -name "*.test.ts" \) 2>/dev/null | grep -q .; then
            npm run test:e2e
          else
            echo "::notice::No Playwright spec files found under tests/e2e/ — skipping the E2E run. See docs/testing.md §1."
          fi

      - name: Dependency vulnerability audit
        run: npm run audit:deps

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
