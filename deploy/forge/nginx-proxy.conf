# Nginx for a Next.js site on Forge.
#
# Forge writes a PHP site config by default. Edit the site's Nginx configuration
# (site → "Edit Files" → "Edit Nginx Configuration") and replace the `location /`
# block with what follows. Leave Forge's own `# FORGE CONFIG (DO NOT REMOVE!)`
# markers and the SSL block untouched — Forge rewrites those on certificate
# renewal and will clobber anything placed between them.

# Static assets are content-hashed by Next, so they can be cached hard and
# served without ever waking the Node process.
location /_next/static/ {
    alias /home/forge/YOUR_SITE_DOMAIN/.next/static/;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, immutable";
}

location /brand/ {
    alias /home/forge/YOUR_SITE_DOMAIN/public/brand/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The application reads the client IP from X-Forwarded-For for the audit
    # trail and for rate limiting. Without this, every request is logged as
    # coming from 127.0.0.1 and the rate limiter buckets the whole internet
    # into one key.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;

    # Document uploads are capped at 15 MB and equipment media at 200 MB in the
    # application; Nginx must not reject them first with a 413.
    client_max_body_size 210M;
}
