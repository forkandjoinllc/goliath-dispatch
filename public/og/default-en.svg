<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ogEnTitle">
  <title id="ogEnTitle">Goliath Dispatch — Heavy-Haul Dispatch Software</title>
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062B5C" />
      <stop offset="100%" stop-color="#041A36" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- hazard accent bar -->
  <rect x="0" y="0" width="1200" height="10" fill="#FF5A00" />

  <!-- logo lockup -->
  <g transform="translate(80,70)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#0B3E7A" />
    <path d="M8 40 H17 L21 46 H43 L47 40 H56" fill="none" stroke="#F7F7F8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="24" cy="49.5" r="3.4" fill="#020F21" stroke="#F7F7F8" stroke-width="1.4" />
    <circle cx="40" cy="49.5" r="3.4" fill="#020F21" stroke="#F7F7F8" stroke-width="1.4" />
    <rect x="19" y="26" width="26" height="16" rx="2" fill="#FF5A00" />
    <path d="M45 26 V19" stroke="#F7F7F8" stroke-width="1.6" stroke-linecap="round" />
    <path d="M45 19 L52 21.5 L45 24 Z" fill="#FF5A00" />
    <text x="78" y="30" font-family="'Roboto Condensed','Arial Narrow',sans-serif" font-weight="700" font-size="30" fill="#FFFFFF">GOLIATH</text>
    <text x="78" y="52" font-family="'Roboto Condensed','Arial Narrow',sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#C4C4C8">DISPATCH</text>
  </g>

  <!-- headline -->
  <text x="80" y="260" font-family="'Roboto Condensed','Arial Narrow',sans-serif" font-weight="700" font-size="54" fill="#FFFFFF">
    <tspan x="80" dy="0">Heavy-haul dispatch software,</tspan>
    <tspan x="80" dy="64">run the way it actually works.</tspan>
  </text>
  <text x="80" y="410" font-family="Inter,Arial,sans-serif" font-size="24" fill="#DCDCDF">
    <tspan x="80" dy="0">Onboarding · Compliance · Dispatch · Tracking</tspan>
    <tspan x="80" dy="34">Permits &amp; Escorts · Settlements</tspan>
  </text>

  <!-- oversize load motif -->
  <g transform="translate(830,340)">
    <path d="M0 60 H26 L38 78 H210 L222 60 H270" fill="none" stroke="#DCDCDF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="40" y="26" width="168" height="46" rx="8" fill="#FF5A00" />
    <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4">
      <line x1="60" y1="26" x2="48" y2="72" />
      <line x1="96" y1="26" x2="84" y2="72" />
      <line x1="132" y1="26" x2="120" y2="72" />
      <line x1="168" y1="26" x2="156" y2="72" />
    </g>
    <g fill="#111827">
      <circle cx="58" cy="86" r="9" />
      <circle cx="82" cy="86" r="9" />
      <circle cx="164" cy="86" r="9" />
      <circle cx="188" cy="86" r="9" />
      <circle cx="244" cy="86" r="9" />
    </g>
  </g>

  <rect x="0" y="620" width="1200" height="10" fill="#FF5A00" />
</svg>
