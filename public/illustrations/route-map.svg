<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="routeMapTitle">
  <title id="routeMapTitle">An abstract map showing a highway route between two points with a permit checkpoint marker</title>
  <rect x="0" y="0" width="600" height="400" fill="#F7F7F8" />

  <!-- Background road grid, deliberately faint -->
  <g stroke="#DCDCDF" stroke-width="2">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="260" y1="0" x2="260" y2="400" />
    <line x1="420" y1="0" x2="420" y2="400" />
    <line x1="520" y1="0" x2="520" y2="400" />
  </g>

  <!-- Primary route -->
  <path
    d="M70 320 C 150 320, 170 220, 250 210 S 380 120, 460 130 S 520 90, 540 70"
    fill="none"
    stroke="#062B5C"
    stroke-width="6"
    stroke-linecap="round"
  />
  <path
    d="M70 320 C 150 320, 170 220, 250 210 S 380 120, 460 130 S 520 90, 540 70"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-dasharray="1 12"
    stroke-linecap="round"
  />

  <!-- Origin marker -->
  <circle cx="70" cy="320" r="10" fill="#FF5A00" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="70" cy="320" r="18" fill="none" stroke="#FF5A00" stroke-width="1.5" opacity="0.4" />

  <!-- Destination marker -->
  <circle cx="540" cy="70" r="10" fill="#062B5C" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="540" cy="70" r="18" fill="none" stroke="#062B5C" stroke-width="1.5" opacity="0.4" />

  <!-- Permit checkpoint marker along the route -->
  <g transform="translate(360,140)">
    <path d="M0 -18 L16 6 L0 30 L-16 6 Z" fill="#FF5A00" stroke="#FFFFFF" stroke-width="2" />
    <text x="0" y="10" text-anchor="middle" font-family="'Inter',Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">!</text>
  </g>

  <!-- State-line dashes to suggest crossing jurisdictions -->
  <g stroke="#9B9B9B" stroke-width="2" stroke-dasharray="6 6" opacity="0.6">
    <line x1="260" y1="0" x2="260" y2="400" />
    <line x1="420" y1="0" x2="420" y2="400" />
  </g>
</svg>
