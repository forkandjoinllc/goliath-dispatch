<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="flatbedOversizeTitle">
  <title id="flatbedOversizeTitle">A lowboy trailer hauling an oversize load with escort vehicles, on a highway with a route line overlay</title>
  <defs>
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A3568" />
      <stop offset="100%" stop-color="#113A72" />
    </linearGradient>
    <linearGradient id="roadGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4A4F" />
      <stop offset="100%" stop-color="#333338" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="url(#skyGradient)" />

  <!-- Route line arcing overhead, evoking the platform's route/permit tracking -->
  <path
    d="M40 120 C 220 40, 420 40, 620 130 S 780 210, 760 230"
    fill="none"
    stroke="#FF5A00"
    stroke-width="3"
    stroke-dasharray="2 14"
    stroke-linecap="round"
    opacity="0.85"
  />
  <circle cx="40" cy="120" r="6" fill="#FF5A00" />
  <circle cx="760" cy="230" r="6" fill="#FF5A00" />

  <!-- Distant skyline, kept simple and flat -->
  <g opacity="0.25" fill="#7099CF">
    <rect x="60" y="230" width="18" height="70" />
    <rect x="90" y="205" width="22" height="95" />
    <rect x="130" y="245" width="16" height="55" />
    <rect x="640" y="215" width="20" height="85" />
    <rect x="672" y="240" width="16" height="60" />
  </g>

  <!-- Road -->
  <rect x="0" y="300" width="800" height="200" fill="url(#roadGradient)" />
  <g stroke="#F7F7F8" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="40" y1="400" x2="140" y2="400" />
    <line x1="220" y1="400" x2="320" y2="400" />
    <line x1="400" y1="400" x2="500" y2="400" />
    <line x1="580" y1="400" x2="680" y2="400" />
    <line x1="740" y1="400" x2="800" y2="400" />
  </g>

  <!-- Lead pilot car with amber light bar -->
  <g transform="translate(90,340)">
    <rect x="0" y="18" width="70" height="24" rx="6" fill="#111827" />
    <rect x="10" y="6" width="34" height="16" rx="5" fill="#111827" />
    <rect x="14" y="9" width="12" height="9" rx="1.5" fill="#7099CF" opacity="0.6" />
    <circle cx="16" cy="44" r="8" fill="#1F1F23" />
    <circle cx="54" cy="44" r="8" fill="#1F1F23" />
    <rect x="20" y="0" width="14" height="6" rx="2" fill="#FF5A00" />
    <rect x="-10" y="26" width="14" height="8" rx="2" fill="#FF5A00" />
  </g>

  <!-- Tractor + lowboy trailer with oversize load -->
  <g transform="translate(260,300)">
    <!-- trailer deck -->
    <path
      d="M0 70 H30 L44 90 H240 L254 70 H310"
      fill="none"
      stroke="#DCDCDF"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- tractor cab -->
    <path d="M264 30 H310 A10 10 0 0 1 320 40 V70 H264 Z" fill="#062B5C" />
    <rect x="272" y="38" width="26" height="20" rx="3" fill="#7099CF" opacity="0.55" />
    <rect x="254" y="55" width="16" height="16" fill="#041A36" />
    <!-- oversize load (industrial tank) -->
    <rect x="46" y="34" width="192" height="56" rx="10" fill="#FF5A00" />
    <rect x="46" y="34" width="192" height="14" rx="7" fill="#E04C00" />
    <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4">
      <line x1="70" y1="34" x2="55" y2="90" />
      <line x1="110" y1="34" x2="95" y2="90" />
      <line x1="150" y1="34" x2="135" y2="90" />
      <line x1="190" y1="34" x2="175" y2="90" />
      <line x1="230" y1="34" x2="215" y2="90" />
    </g>
    <rect x="128" y="20" width="24" height="14" rx="2" fill="#9B9B9B" />
    <!-- oversize load sign -->
    <rect x="6" y="72" width="30" height="12" rx="1.5" fill="#FF5A00" stroke="#FFFFFF" stroke-width="1" />
    <!-- wheels -->
    <g fill="#111827">
      <circle cx="66" cy="100" r="10" />
      <circle cx="94" cy="100" r="10" />
      <circle cx="188" cy="100" r="10" />
      <circle cx="216" cy="100" r="10" />
      <circle cx="278" cy="100" r="10" />
      <circle cx="302" cy="100" r="10" />
    </g>
    <g fill="#4A4A4F">
      <circle cx="66" cy="100" r="4.5" />
      <circle cx="94" cy="100" r="4.5" />
      <circle cx="188" cy="100" r="4.5" />
      <circle cx="216" cy="100" r="4.5" />
      <circle cx="278" cy="100" r="4.5" />
      <circle cx="302" cy="100" r="4.5" />
    </g>
    <!-- flag -->
    <path d="M0 34 V16" stroke="#DCDCDF" stroke-width="2" stroke-linecap="round" />
    <path d="M0 16 L16 21 L0 26 Z" fill="#FF5A00" />
  </g>

  <!-- Rear escort car -->
  <g transform="translate(640,336)">
    <rect x="0" y="18" width="70" height="24" rx="6" fill="#111827" />
    <rect x="10" y="6" width="34" height="16" rx="5" fill="#111827" />
    <rect x="14" y="9" width="12" height="9" rx="1.5" fill="#7099CF" opacity="0.6" />
    <circle cx="16" cy="44" r="8" fill="#1F1F23" />
    <circle cx="54" cy="44" r="8" fill="#1F1F23" />
    <rect x="20" y="0" width="14" height="6" rx="2" fill="#FF5A00" />
    <rect x="66" y="26" width="14" height="8" rx="2" fill="#FF5A00" />
  </g>

  <!-- Ground shadow -->
  <ellipse cx="400" cy="412" rx="360" ry="10" fill="#020F21" opacity="0.35" />
</svg>
